<!-- NAVBAR -->
<div class="navbar-fixed">
    <nav class="teal">
        <div class="container">
            <div class="nav-wrapper">

                <a href="#" class="brand-logo">
                    JaboaTravel
                </a>

                <a href="#" data-target="mobile-nav" class="sidenav-trigger">
                    <i class="material-icons">menu</i>
                </a>

                <ul class="right hide-on-med-and-down">
                    <li>
                        <a href="#pacotes">Pacotes</a>
                    </li>

                    <li>
                        <a href="#passagens">Passagens Aéreas</a>
                    </li>

                    <li>

                    </li>
                </ul>

            </div>
        </div>
    </nav>
</div>


<!-- SLIDER -->
<div class="slider">
    <ul class="slides">

        <li>
            <img src="img/philli.jpg" alt="Filipinas">

            <div class="caption center-align">
                <h3>Viagens para todos os orçamentos</h3>
            </div>
        </li>

        <li>
            <img src="img/patagonia.jpeg" alt="Patagônia">

            <div class="caption left-align">
                <h3>Pacotes individuais e em grupo</h3>
            </div>
        </li>

        <li>
            <img src="img/amsterdan.jpeg" alt="Amsterdam">

            <div class="caption right-align">
                <h3>Hospedagem e translados</h3>
            </div>
        </li>

    </ul>
</div>


<!-- Materialize JavaScript -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

<!-- Slider -->
<script>
    document.addEventListener('DOMContentLoaded', function() {

        const slider = document.querySelector('.slider');

        M.Slider.init(slider, {
            indicators: false,
            height: 500,
            transition: 500,
            interval: 6000
        });

    });
</script>

</body>
